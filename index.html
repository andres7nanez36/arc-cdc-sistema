<!-- MÓDULO DE CONTROL POR VOZ Y VISUALIZACIÓN 3D (Limpio y Enlazado) -->
<script>
  class ControlVozProyectoConfi {
    constructor() {
      this.activo = false;
      this.ocupado = false;
      this.reconocedor = null;
      this.llaveSeguridad = "Ñ-3.6-SEGV1"; // Llave fija de validación
      this.cajaNegra = []; // Historial forense interno aislado
      this.inicializarReconocimiento();
    }

    registrarCajaNegra(evento, detalle) {
      const registro = {
        timestamp: new Date().toISOString(),
        evento: evento,
        detalle: detalle
      };
      this.cajaNegra.push(registro);
      if (this.cajaNegra.length > 50) this.cajaNegra.shift();
    }

    inicializarReconocimiento() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        console.warn("El navegador no soporta reconocimiento de voz nativo.");
        return;
      }

      this.reconocedor = new SpeechRecognition();
      this.reconocedor.lang = 'es-CO';
      this.reconocedor.continuous = true;
      this.reconocedor.interimResults = false;

      this.reconocedor.onresult = (event) => {
        const texto = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
        console.log("🎙️ [Caja Negra] Audio capturado:", texto);
        this.registrarCajaNegra("AUDIO_CAPTURADO", texto);
        this.procesarComando(texto);
      };

      this.reconocedor.onerror = (event) => {
        this.registrarCajaNegra("ERROR_RECONOCIMIENTO", event.error);
      };

      this.reconocedor.onend = () => {
        if (this.activo) {
          try { this.reconocedor.start(); } catch (e) {}
        }
      };
    }

    iniciar() {
      this.activo = true;
      try {
        this.reconocedor.start();
        console.log("🟢 Sistema de escucha por voz activado.");
        this.registrarCajaNegra("SISTEMA_INICIADO", "Escucha activa");
      } catch (e) {
        console.log("El reconocedor ya estaba activo.");
      }
    }

    detener() {
      this.activo = false;
      try { this.reconocedor.stop(); } catch (e) {}
      console.log("🔴 Sistema de escucha detenido.");
      this.registrarCajaNegra("SISTEMA_DETENIDO", "Corte manual");
    }

    procesarComando(texto) {
      // 1. CERROJO DE EMERGENCIA (Freno)
      if (this.ocupado) {
        if (texto.includes("alto") || texto.includes("detente")) {
          this.ocupado = false;
          this.registrarCajaNegra("FRENO_EMERGENCIA", "Activado por voz");
          alert("⏸️ [SISTEMA]: Freno de emergencia aplicado. Canal libre.");
        }
        return;
      }

      // 2. VALIDACIÓN DE LLAVE SEGURA
      const tieneLlave = texto.includes(this.llaveSeguridad.toLowerCase()) || texto.includes("ñ-3.6-segv1");

      // 3. COMANDOS PRINCIPALES DE APERTURA Y VISUALIZACIÓN 3D
      if (texto.includes("abrir proyecto confi") || texto.includes("abrir proyecto renacer")) {
        if (tieneLlave) {
          this.iniciar();
          this.registrarCajaNegra("ACCESO_AUTORIZADO", "Comando y llave segura validados");
          
          // Enlace directo con tu función de campo topológico y curvas en 3D (si existe en tu script principal)
          if (typeof iniciarCampo3D === 'function') {
            try { iniciarCampo3D(); } catch (e) { console.warn("Error al iniciar campo 3D:", e); }
          }

          alert("🚀 [SISTEMA]: Llave correcta. Campo topológico 3D y curvas sincronizados.");
        } else {
          this.registrarCajaNegra("ACCESO_DENEGADO", "Intento sin llave o llave incorrecta");
          alert("⛔ [SISTEMA]: Acceso denegado. Falta la llave segura de validación.");
        }
      }
    }
  }

  // Instanciar el módulo limpio y conectado al motor 3D
  const controlVoz = new ControlVozProyectoConfi();
  
  window.addEventListener('load', () => {
    console.log("Módulo de voz y visualización 3D listo.");
  });
</script>
