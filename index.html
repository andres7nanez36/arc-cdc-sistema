<!-- ========================================== -->
<!-- MÓDULO DE VOZ SEGURO CON BOTÓN TÁCTIL DE ACTIVACIÓN -->
<!-- ========================================== -->
<div style="text-align: center; margin: 15px 0;">
  <button id="btn-activar-voz" style="background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">🎙️ Activar Control por Voz (Seguro)</button>
  <span id="estado-voz-display" style="display: block; font-size: 10px; color: #94a3b8; margin-top: 5px;">Micrófono en reposo (Protegido contra ruido externo)</span>
</div>

<script>
  class ControlVozSeguro {
    constructor() {
      this.reconocedor = null;
      this.escuchando = false;
      this.llaveSecreta = "tilden 3.6";
      this.firmaAutoridad = "soy andrés";
      this.inicializar();
    }

    inicializar() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        console.warn("Navegador sin soporte de voz.");
        return;
      }

      this.reconocedor = new SpeechRecognition();
      this.reconocedor.lang = 'es-CO';
      this.reconocedor.continuous = false; // Se apaga solo tras cada frase para evitar bucles de ruido
      this.reconocedor.interimResults = false;

      this.reconocedor.onresult = (event) => {
        const texto = event.results[0][0].transcript.toLowerCase().trim();
        console.log("🎙️ Audio procesado:", texto);
        this.procesarComandoSeguro(texto);
      };

      this.reconocedor.onerror = (event) => {
        this.actualizarEstado("⚠️ Error o silencio detectado. Micrófono en reposo.");
        this.escuchando = false;
      };

      this.reconocedor.onend = () => {
        this.escuchando = false;
        this.actualizarEstado("Micrófono en reposo (Protegido)");
      };

      // Vincular el botón táctil físico para abrir el canal de voz
      document.getElementById('btn-activar-voz')?.addEventListener('click', () => {
        this.alternarEscucha();
      });
    }

    actualizarEstado(mensaje) {
      const display = document.getElementById('estado-voz-display');
      if (display) display.innerText = mensaje;
    }

    alternarEscucha() {
      if (!this.reconocedor) return;
      
      if (!this.escuchando) {
        try {
          this.reconocedor.start();
          this.escuchando = true;
          this.actualizarEstado("🟢 Escuchando... Di tu comando con autorización.");
        } catch (e) {
          console.log("Ya activo");
        }
      } else {
        this.reconocedor.stop();
        this.escuchando = false;
        this.actualizarEstado("🔴 Micrófono detenido manualmente.");
      }
    }

    procesarComandoSeguro(texto) {
      // FILTRO DE EXCLUSIVIDAD: Debe incluir tu firma y la llave obligatoria
      const esMiVoz = texto.includes(this.firmaAutoridad) && texto.includes(this.llaveSecreta);

      if (!esMiVoz) {
        alert("⛔ [SISTEMA BLOQUEADO]: Voz no autorizada o llave ausente. Comando ignorado por seguridad.");
        return;
      }

      // Comandos ejecutados solo si la firma es correcta
      if (texto.includes("abrir proyecto") || texto.includes("activar proyecto")) {
        alert("🚀 [SISTEMA]: Autorización concedida. Proyecto sincronizado.");
      }
      else if (texto.includes("limpiar") || texto.includes("nuevo central")) {
        const rSlider = document.getElementById('r-slider');
        const mSlider = document.getElementById('m-slider');
        if (rSlider) rSlider.value = 0;
        if (mSlider) mSlider.value = 1.0;
        alert("🧹 [SISTEMA]: Tablero despejado por comando de voz autorizado.");
      }
      else if (texto.includes("analiza") || texto.includes("verifica")) {
        document.getElementById('btn-ejecutar')?.click();
        alert("📊 [SISTEMA]: Verificación CERN ejecutada de forma segura.");
      }
    }
  }

  // Inicializar módulo seguro
  window.controlVozSeguro = new ControlVozSeguro();
</script>
